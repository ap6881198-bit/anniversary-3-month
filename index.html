<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Our Love Story</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="hearts-container"></div>

<!-- PAGE 1 -->

<section id="page1" class="page active">

<h1>Happy 3 Month Anniversary ❤️</h1>

<p>You make my life brighter everyday</p>

<div id="timer"></div>

<button class="loveBtn" onclick="nextPage(2)">Next</button>

</section>


<!-- PAGE 2 LETTER -->

<section id="page2" class="page">

<h2>My Love 💌</h2>

<p id="letter"></p>

<button class="loveBtn" onclick="nextPage(3)">Next</button>

</section>


<!-- PAGE 3 GAME -->

<section id="page3" class="page">

<h2>Catch My Heart ❤️</h2>

<p>Tap the hearts to collect them</p>

<div id="gameArea"></div>

<div id="score">0 / 10</div>

</section>


<!-- PAGE 4 SLIDESHOW -->

<section id="page4" class="page">

<h2>Our Memories ❤️</h2>

<div class="slideshow">

<img src="images/photo1.jpg">

<img src="images/photo2.jpg">

<img src="images/photo3.jpg">

<img src="images/photo4.jpg">

</div>

<audio id="song" src="music/love.mp3"></audio>

</section>


<!-- FINAL POPUP -->

<div id="popup">

<p>

I never lied when I said I love you.  
I never cared about your past.  

I only want to create our future together.

Once again…

I love you my love ❤️

</p>

<button onclick="fireworks()">I Love You ❤️</button>

</div>


<script src="script.js"></script>

</body>
</html>
